name: Build HIV Surveillance Manager

# Builds the HIV surveillance manager from a section release with the shared manager
# build (manager-build.yml), compared against the promoted manager. The HIV-specific
# steps are in data_processing/hiv.surveillance.manager/ci/.

on:
  workflow_dispatch:
    inputs:
      sections_release_tag:
        description: 'Release tag for section files'
        required: true
        default: 'hiv-sections-latest'
        type: string
      raw_data_release_tag:
        description: 'Release tag for raw data (county-to-county movement)'
        required: true
        default: 'data-raw-latest'
        type: string
      deps_release_tag:
        description: 'Release tag for manager dependencies (census manager)'
        required: true
        default: 'data-managers-latest'
        type: string
      jheem2_ref:
        description: 'jheem2 branch, tag, or commit to use'
        required: false
        default: 'dev'
        type: string

permissions:
  contents: write

# One build at a time, so two builds on one day can't take the same tag.
concurrency:
  group: build-hiv-surveillance-manager
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/manager-build.yml
    with:
      manager_dir: hiv.surveillance.manager
      sections_release_tag: ${{ inputs.sections_release_tag || 'hiv-sections-latest' }}
      baseline_release_tag: hiv-surveillance-manager-latest
      jheem2_ref: ${{ inputs.jheem2_ref || 'dev' }}
      raw_data_release_tag: ${{ inputs.raw_data_release_tag || 'data-raw-latest' }}
      deps_release_tag: ${{ inputs.deps_release_tag || 'data-managers-latest' }}
