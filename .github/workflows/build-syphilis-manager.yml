name: Build Syphilis Manager

on:
  workflow_dispatch:
    inputs:
      sections_release_tag:
        description: 'Release tag for section files'
        required: true
        default: 'syphilis-sections-latest'
        type: string
      raw_data_release_tag:
        description: 'Release tag for raw data'
        required: true
        default: 'data-raw-latest'
        type: string
      deps_release_tag:
        description: 'Release tag for manager dependencies'
        required: true
        default: 'data-managers-latest'
        type: string
      jheem2_ref:
        description: 'jheem2 branch or tag to use'
        required: false
        default: 'dev'
        type: string
      force_update_spec:
        description: 'Force spec regeneration even on regressions (use only when regressions are intentional)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# One build at a time: builds number their tags by date and may push a spec commit.
concurrency:
  group: build-syphilis-manager
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout jheem_analyses
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout jheem2
        uses: actions/checkout@v4
        with:
          repository: CIPHER-Epi/jheem2
          ref: ${{ inputs.jheem2_ref }}
          path: _jheem2

      - name: Symlink jheem2 as sibling directory
        run: ln -s "$GITHUB_WORKSPACE/_jheem2" "$GITHUB_WORKSPACE/../jheem2"

      - name: Set up R
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          # Packages built under one R version can't be restored into another.
          key: r-packages-${{ runner.os }}-r${{ steps.setup-r.outputs.installed-r-version }}-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: r-packages-${{ runner.os }}-r${{ steps.setup-r.outputs.installed-r-version }}-

      - name: Install R dependencies
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install.packages(c("remotes", "jsonlite", "readxl", "dplyr", "stringr", "tidyr"))
          remotes::install_github("tfojo1/locations")
          remotes::install_local("_jheem2", upgrade = "never")
        shell: Rscript {0}

      - name: Download section files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _ci_inputs/sections
          gh release download "${{ inputs.sections_release_tag }}" \
            --dir _ci_inputs/sections \
            --pattern "syphilis.manager_section*.rdata"
          echo "Section files:"
          ls -lh _ci_inputs/sections/

      - name: Download raw data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _ci_inputs/raw
          gh release download "${{ inputs.raw_data_release_tag }}" \
            --dir _ci_inputs/raw \
            --pattern "data-raw-*.tar.gz"
          for f in _ci_inputs/raw/data-raw-*.tar.gz; do
            tar -xzf "$f" -C _ci_inputs/raw --no-same-owner --no-same-permissions --delay-directory-restore
          done
          # Ensure all directories are writable (NAS preserves read-only dirs)
          find _ci_inputs/raw/data_raw -type d -exec chmod u+rwx {} +
          echo "Raw data extracted:"
          ls -lh _ci_inputs/raw/data_raw/

      - name: Download manager dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _ci_inputs/deps
          gh release download "${{ inputs.deps_release_tag }}" \
            --dir _ci_inputs/deps
          echo "Dependency files:"
          ls -lh _ci_inputs/deps/

      - name: Verify downloads and record exact inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECTIONS_RELEASE: ${{ inputs.sections_release_tag }}
          RAW_RELEASE: ${{ inputs.raw_data_release_tag }}
          DEPS_RELEASE: ${{ inputs.deps_release_tag }}
          JHEEM2_REF: ${{ inputs.jheem2_ref }}
        run: |
          set -euo pipefail
          mkdir -p _ci_outputs

          # Check each downloaded file against the SHA-256 digest GitHub publishes for it.
          verify_release() {  # <tag> <dir>
            local assets name digest checked=0
            assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$1" \
              --jq '.assets[] | "\(.name) \(.digest // "none")"')
            while read -r name digest; do
              [[ -f "$2/$name" ]] || continue
              if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "${digest#sha256:}  $2/$name" | sha256sum -c --quiet -
                checked=$((checked + 1))
              else
                echo "::warning::$1 publishes no digest for $name"
              fi
            done <<< "$assets"
            echo "$1: $checked file(s) match their published digests"
          }
          verify_release "$SECTIONS_RELEASE" _ci_inputs/sections
          verify_release "$RAW_RELEASE" _ci_inputs/raw
          verify_release "$DEPS_RELEASE" _ci_inputs/deps

          # The dated release a *-latest alias points to (raw data and dependencies).
          exact() {  # <tag>
            if [[ "$1" != *latest* ]]; then echo "$1"; return; fi
            local dated
            dated=$(gh release view "$1" --repo "$GITHUB_REPOSITORY" --json body -q .body \
              | sed -n 's/^\*\*Points to:\*\* `\([^`]*\)`.*/\1/p' | head -1)
            echo "${dated:-unresolved}"
          }

          {
            echo "analyses_commit=$GITHUB_SHA"
            echo "jheem2_ref=$JHEEM2_REF"
            echo "jheem2_commit=$(git -C _jheem2 rev-parse HEAD)"
            echo "locations_commit=$(Rscript -e 'x <- packageDescription("locations")$RemoteSha; cat(if (is.null(x)) "unknown" else x)')"
            echo "r_version=$(Rscript -e 'cat(R.version$major, R.version$minor, sep = ".")')"
            # Syphilis section uploads replace one mutable release, so the files' digests
            # are the record of which sections were used.
            echo "sections_release=$SECTIONS_RELEASE"
            echo "sections_published_at=$(gh release view "$SECTIONS_RELEASE" --repo "$GITHUB_REPOSITORY" --json publishedAt -q .publishedAt)"
            echo "sections_files_sha256=$(cd _ci_inputs/sections && sha256sum syphilis.manager_section*.rdata | sha256sum | cut -d' ' -f1)"
            echo "raw_data_release=$RAW_RELEASE"
            echo "raw_data_exact=$(exact "$RAW_RELEASE")"
            echo "deps_release=$DEPS_RELEASE"
            echo "deps_exact=$(exact "$DEPS_RELEASE")"
            sha256sum _ci_inputs/sections/*.rdata _ci_inputs/raw/*.tar.gz _ci_inputs/deps/*
          } > _ci_outputs/input_identity.txt
          cat _ci_outputs/input_identity.txt

      - name: Arrange CI inputs into Q_ROOT layout
        run: |
          mkdir -p _ci_root/data_managers/data.manager.merge
          cp _ci_inputs/sections/*.rdata _ci_root/data_managers/data.manager.merge/
          cp _ci_inputs/deps/*.rdata _ci_root/data_managers/
          if [ -d _ci_inputs/raw/data_raw ]; then
            ln -s "$(pwd)/_ci_inputs/raw/data_raw" _ci_root/data_raw
          fi
          echo "Q_ROOT layout:"
          find _ci_root -maxdepth 3 -type f | head -20

      - name: Run merge pipeline
        env:
          Q_ROOT: _ci_root
          OUTPUT_DIR: _ci_outputs
          ARCHIVE_DIR: _ci_outputs
          CACHED_DIR: _ci_outputs
        run: |
          set -o pipefail
          mkdir -p _ci_outputs
          Rscript -e "
            library(jheem2)
            library(locations)
            library(dplyr)
            library(readxl)
            library(stringr)
            library(tidyr)
            source('data_processing/syphilis.manager/syphilis.processing.for.merging/syphilis.manager.merge.R')
            writeLines(capture.output(sessionInfo()), '_ci_outputs/session_info.txt')
          " 2>&1 | tee _ci_outputs/build_log.txt

      - name: Validate structure
        id: validation
        run: |
          set +e
          set -o pipefail
          Rscript data_processing/syphilis.manager/validation/run_validation.R \
            _ci_outputs/syphilis.manager.rdata \
            2>&1 | tee _ci_outputs/validation_report.txt
          EXIT_CODE=$?
          set -e

          # Exit codes: 0 = clean pass, 1 = regressions, 2 = pass with additions
          if [ $EXIT_CODE -eq 0 ]; then
            echo "spec_action=none" >> "$GITHUB_OUTPUT"
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "spec_action=auto_update" >> "$GITHUB_OUTPUT"
          elif [ $EXIT_CODE -eq 1 ] && [ "${{ inputs.force_update_spec }}" = "true" ]; then
            echo "spec_action=force_update" >> "$GITHUB_OUTPUT"
          else
            echo "Structural regressions detected. If these are intentional, re-run with force_update_spec=true."
            exit 1
          fi

      - name: Auto-update spec
        # Only master builds change the spec; builds from other branches are checks.
        if: >-
          github.ref == 'refs/heads/master' &&
          (steps.validation.outputs.spec_action == 'auto_update' ||
          steps.validation.outputs.spec_action == 'force_update')
        run: |
          # Save current report as the diff (shows what changed before regeneration)
          cp _ci_outputs/validation_report.txt _ci_outputs/spec_diff.txt

          Rscript data_processing/syphilis.manager/validation/generate_spec.R \
            _ci_outputs/syphilis.manager.rdata

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_processing/syphilis.manager/validation/syphilis_manager_spec.json
          git diff --cached --quiet && echo "No spec changes" || \
            git commit -m "Auto-update syphilis manager spec

          Sections: ${{ inputs.sections_release_tag }}
          Raw data: ${{ inputs.raw_data_release_tag }}
          Dependencies: ${{ inputs.deps_release_tag }}
          jheem2: ${{ inputs.jheem2_ref }}"
          git push

      - name: Summarize the failure
        # The error that stopped the build, on the run's summary page.
        if: failure()
        run: |
          bash scripts/summarize_build_failure.sh _ci_outputs/build_log.txt \
            _ci_outputs/validation_report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syphilis-manager-build
          path: |
            _ci_outputs/build_log.txt
            _ci_outputs/validation_report.txt
            _ci_outputs/spec_diff.txt
            _ci_outputs/input_identity.txt
            _ci_outputs/session_info.txt

      - name: Create versioned release
        # Runs from other branches are checks only and never publish.
        if: success() && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_TAG="syphilis-manager-v$(date +%Y.%m.%d)"
          # Append sequence number if tag already exists (multiple builds in a day)
          if gh release view "$VERSION_TAG" &>/dev/null; then
            SEQ=2
            while gh release view "${VERSION_TAG}.${SEQ}" &>/dev/null; do
              SEQ=$((SEQ + 1))
            done
            VERSION_TAG="${VERSION_TAG}.${SEQ}"
          fi

          # Build release notes with embedded validation report
          SPEC_ACTION="${{ steps.validation.outputs.spec_action }}"
          if [ "$SPEC_ACTION" = "auto_update" ]; then
            SPEC_NOTE="Spec: auto-updated (additive changes)"
          elif [ "$SPEC_ACTION" = "force_update" ]; then
            SPEC_NOTE="Spec: force-updated (review commit)"
          else
            SPEC_NOTE="Validation: PASSED"
          fi
          id() { grep "^$1=" _ci_outputs/input_identity.txt | cut -d= -f2; }
          digest() { grep "  $1\$" _ci_outputs/input_identity.txt | cut -c1-12; }
          NOTES="## Build Info
          | Input | Release | Exact version |
          |---|---|---|
          | **Sections** | \`${{ inputs.sections_release_tag }}\` | uploaded $(id sections_published_at), files \`$(id sections_files_sha256 | cut -c1-12)\` |
          | **Raw Data** | \`${{ inputs.raw_data_release_tag }}\` | \`$(id raw_data_exact)\` |
          | **Dependencies** | \`${{ inputs.deps_release_tag }}\` | \`$(id deps_exact)\`, census \`$(digest _ci_inputs/deps/census.manager.rdata)\` |
          | **jheem2** | \`${{ inputs.jheem2_ref }}\` | \`$(id jheem2_commit | cut -c1-8)\` |
          | **locations** | default branch | \`$(id locations_commit | cut -c1-8)\` |
          | **R** | release | $(id r_version) |
          | **Commit** | | \`${GITHUB_SHA:0:7}\` |
          | **Status** | | $SPEC_NOTE |

          Full digests are in \`input_identity.txt\`.

          > To promote this build to \`latest\`, run the **Promote Syphilis Manager** workflow with tag \`$VERSION_TAG\`."

          if [ -f _ci_outputs/spec_diff.txt ]; then
            DIFF=$(cat _ci_outputs/spec_diff.txt)
            NOTES="$NOTES

          <details>
          <summary>Spec Changes (click to expand)</summary>

          What changed from the previous spec:

          \`\`\`
          $DIFF
          \`\`\`

          </details>"
          fi

          if [ -f _ci_outputs/validation_report.txt ]; then
            REPORT=$(cat _ci_outputs/validation_report.txt)
            NOTES="$NOTES

          <details>
          <summary>Validation Report (click to expand)</summary>

          \`\`\`
          $REPORT
          \`\`\`

          </details>"
          fi

          ASSETS="_ci_outputs/syphilis.manager.rdata _ci_outputs/input_identity.txt"
          if [ -f _ci_outputs/validation_report.txt ]; then
            ASSETS="$ASSETS _ci_outputs/validation_report.txt"
          fi
          gh release create "$VERSION_TAG" \
            --title "Syphilis Manager $VERSION_TAG" \
            --notes "$NOTES" \
            $ASSETS
          echo "Published release: $VERSION_TAG"
