name: Promote Syphilis Manager

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to promote to latest (e.g. syphilis-manager-v2026.02.24)'
        required: true
        type: string
      deps_release_tag:
        description: 'Immutable data-managers release tag providing census.manager.rdata'
        required: true
        type: string
      jheem2_ref:
        description: 'Exact jheem2 commit or immutable tag used for compatibility checks'
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "ERROR: Release '${{ inputs.release_tag }}' not found"
            exit 1
          fi
          echo "Found release: ${{ inputs.release_tag }}"

      - name: Checkout jheem_analyses
        uses: actions/checkout@v4

      - name: Checkout jheem2
        uses: actions/checkout@v4
        with:
          repository: tfojo1/jheem2
          ref: ${{ inputs.jheem2_ref }}
          path: _jheem2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-packages-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: r-packages-

      - name: Install R dependencies
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install.packages(c("remotes", "jsonlite", "readxl", "dplyr", "stringr", "tidyr"))
          remotes::install_github("tfojo1/locations")
          remotes::install_github("tfojo1/distributions")
          remotes::install_local("_jheem2", upgrade = "never")
        shell: Rscript {0}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _assets
          gh release download "${{ inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir _assets
          echo "Downloaded assets:"
          ls -lh _assets/

      - name: Download manager dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _deps
          gh release download "${{ inputs.deps_release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir _deps \
            --pattern "census.manager.rdata"

      - name: Verify structural validation
        run: |
          if [ ! -f _assets/validation_report.txt ]; then
            echo "ERROR: Release does not include validation_report.txt"
            exit 1
          fi
          if ! grep -Fq "RESULT: PASS" _assets/validation_report.txt; then
            echo "ERROR: Release did not pass structural validation"
            exit 1
          fi
          echo "Structural validation passed"

      - name: Check SHIELD manager contract
        run: |
          Rscript applications/SHIELD/tests/test_manager_contract.R \
            _assets/syphilis.manager.rdata \
            _deps/census.manager.rdata

      - name: Smoke-test SHIELD in Baltimore
        run: |
          Rscript applications/SHIELD/tests/smoke_manager_compatibility.R \
            _assets/syphilis.manager.rdata \
            _deps/census.manager.rdata

      - name: Update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG="syphilis-manager-latest"
          # Delete existing latest release if it exists
          gh release delete "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true

          # Get the source release notes to extract build info
          SOURCE_NOTES=$(gh release view "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" --json body -q .body)

          NOTES="## Latest Syphilis Manager

          **Promoted from:** \`${{ inputs.release_tag }}\`
          **Promoted at:** $(date -u +%Y-%m-%d\ %H:%M\ UTC)
          **Census manager release:** \`${{ inputs.deps_release_tag }}\`
          **jheem2 compatibility ref:** \`${{ inputs.jheem2_ref }}\`

          **Stable download URL:**
          \`\`\`
          https://github.com/${GITHUB_REPOSITORY}/releases/download/syphilis-manager-latest/syphilis.manager.rdata
          \`\`\`

          ---

          $SOURCE_NOTES"

          gh release create "$LATEST_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Syphilis Manager (Latest)" \
            --notes "$NOTES" \
            _assets/*
          echo "Promoted ${{ inputs.release_tag }} to latest"
