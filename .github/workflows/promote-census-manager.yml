name: Promote Census Manager

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to promote to census-manager-latest (e.g. census-manager-v2026.10.23)'
        required: true
        type: string
      reviewed_changes:
        description: 'I have reviewed this build''s structural removals and SHIELD check and they are intended (only needed when the release says "Needs review")'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      REVIEWED_CHANGES: ${{ inputs.reviewed_changes }}
      LATEST_TAG: census-manager-latest
    steps:
      - name: Validate release exists
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^census-manager-v[0-9][0-9.]*$ ]]; then
            echo "ERROR: '$RELEASE_TAG' is not a census-manager-v* tag"
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "ERROR: Release '$RELEASE_TAG' not found"
            exit 1
          fi
          echo "Found release: $RELEASE_TAG"

      - name: Download and verify release assets
        run: |
          set -euo pipefail
          mkdir -p _assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir _assets
          # Every asset must match the SHA-256 digest GitHub publishes for it. Built
          # releases also carry SHA256SUMS.txt; earlier census releases may not.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[] | "\(.digest | sub("^sha256:"; ""))  _assets/\(.name)"' > _published.txt
          if [[ ! -s _published.txt ]] || grep -qv '^[0-9a-f]\{64\}  ' _published.txt; then
            echo "ERROR: $RELEASE_TAG has an asset without a published SHA-256 digest"
            exit 1
          fi
          sha256sum -c _published.txt
          [[ -f _assets/census.manager.rdata ]]
          if [[ -f _assets/SHA256SUMS.txt ]]; then (cd _assets && sha256sum -c SHA256SUMS.txt); fi
          # Builds flagged for review need explicit confirmation.
          if [[ -f _assets/build_status.json ]] && \
             [[ "$(jq -r '.needs_review' _assets/build_status.json)" == "true" ]] && \
             [[ "$REVIEWED_CHANGES" != "true" ]]; then
            echo "ERROR: $RELEASE_TAG removes structure present in the promoted census, or SHIELD does not start with it."
            echo "Review its release notes, then re-run with the review box ticked."
            exit 1
          fi
          echo "Downloaded assets:"
          ls -lh _assets/

      - name: Update latest release
        run: |
          set -euo pipefail
          gh release delete "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true

          SOURCE_NOTES=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          MANAGER_SHA=$(sha256sum _assets/census.manager.rdata | cut -d' ' -f1)

          # Builds and loaders read the "Promoted from" line as the version.
          {
            echo "## Latest Census Manager"
            echo
            echo "**Promoted from:** \`$RELEASE_TAG\`"
            echo "**Promoted at:** $(date -u +%Y-%m-%d\ %H:%M\ UTC)"
            echo "**SHA-256:** \`$MANAGER_SHA\`"
            echo
            echo "**Stable download URL:**"
            echo '```'
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/$LATEST_TAG/census.manager.rdata"
            echo '```'
            echo
            echo "---"
            echo
            echo "$SOURCE_NOTES"
          } > _notes.md

          gh release create "$LATEST_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Census Manager (Latest)" \
            --notes-file _notes.md \
            --latest=false \
            _assets/*
          echo "Promoted $RELEASE_TAG to latest"
