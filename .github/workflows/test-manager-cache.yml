name: Test manager cache

on:
  push:
    branches: [master]
    paths:
      - 'commoncode/cache_manager.R'
      - 'commoncode/data_manager_sources.json'
      - 'commoncode/tests/test_data_manager_release_selection.R'
      - '.github/workflows/test-manager-cache.yml'
  pull_request:
    paths:
      - 'commoncode/cache_manager.R'
      - 'commoncode/data_manager_sources.json'
      - 'commoncode/tests/test_data_manager_release_selection.R'
      - '.github/workflows/test-manager-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true
      - name: Install test dependencies
        run: Rscript -e 'install.packages(c("httr2", "jsonlite", "filelock", "openssl"))'
      - name: Check version selection, verification, migration, and offline reads
        run: Rscript commoncode/tests/test_data_manager_release_selection.R
