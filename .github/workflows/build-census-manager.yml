name: Build Census Manager

# Builds the census manager from a section release with the shared manager build
# (manager-build.yml). The census-specific steps are in data_processing/census.manager/ci/.

on:
  workflow_dispatch:
    inputs:
      sections_release_tag:
        description: 'Release tag for section files'
        required: true
        default: 'census-sections-latest'
        type: string
      baseline_release_tag:
        description: 'Census release to compare against (the promoted census by default)'
        required: true
        default: 'census-manager-latest'
        type: string
      jheem2_ref:
        description: 'jheem2 branch, tag, or commit to use'
        required: false
        default: 'dev'
        type: string

permissions:
  contents: write

# One build at a time, so two builds on one day can't take the same tag.
concurrency:
  group: build-census-manager
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/manager-build.yml
    with:
      manager_dir: census.manager
      sections_release_tag: ${{ inputs.sections_release_tag || 'census-sections-latest' }}
      baseline_release_tag: ${{ inputs.baseline_release_tag || 'census-manager-latest' }}
      jheem2_ref: ${{ inputs.jheem2_ref || 'dev' }}
